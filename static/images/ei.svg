<svg xmlns="http://www.w3.org/2000/svg" viewBox="38 26 404 392" width="404" height="392" role="img" aria-labelledby="eiTitle eiDesc">
  <title id="eiTitle">Entrepreneurship</title>
  <desc id="eiDesc">Flat illustration of a rocket launching from a rising growth chart, representing venture creation and startup momentum.</desc>

  <defs>
    <linearGradient id="eiSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1DF"/>
      <stop offset="1" stop-color="#FFE3C2"/>
    </linearGradient>
    <linearGradient id="eiBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#EEF3F9"/>
      <stop offset="1" stop-color="#CBD8E6"/>
    </linearGradient>
    <linearGradient id="eiNose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA733"/>
      <stop offset="1" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="eiSlab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="eiFlame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC776"/>
      <stop offset="1" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>

  <!-- ambient disc -->
  <circle cx="248" cy="214" r="176" fill="url(#eiSky)"/>
  <circle cx="248" cy="214" r="176" fill="none" stroke="#FF8C00" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="14 12"/>

  <!-- orbit arc -->
  <path d="M78 300 A 190 190 0 0 1 300 44" fill="none" stroke="#FF8C00" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 14"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.92">
    <path d="M96 148c0-13 11-23 24-23 6 0 12 2 16 6 4-11 15-19 27-19 16 0 29 13 29 29 0 2 0 4-1 6H110c-8-1-14-8-14-16z"/>
    <path d="M330 300c0-10 8-18 19-18 5 0 9 2 13 5 3-9 12-15 21-15 13 0 23 10 23 23 0 2 0 3-1 5h-64c-6-1-11-6-11-11z" opacity="0.75"/>
  </g>

  <!-- growth chart -->
  <g>
    <rect x="72" y="392" width="252" height="12" rx="6" fill="url(#eiSlab)"/>
    <rect x="86" y="334" width="42" height="58" rx="8" fill="#334155"/>
    <rect x="140" y="304" width="42" height="88" rx="8" fill="#1E293B"/>
    <rect x="194" y="268" width="42" height="124" rx="8" fill="#0B1220"/>
    <rect x="248" y="222" width="42" height="170" rx="8" fill="url(#eiNose)"/>
    <!-- trend line over the bars -->
    <polyline points="107,320 161,290 215,254 269,208" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#FFFFFF">
      <circle cx="107" cy="320" r="6"/>
      <circle cx="161" cy="290" r="6"/>
      <circle cx="215" cy="254" r="6"/>
    </g>
    <circle cx="269" cy="208" r="9" fill="#FFFFFF"/>
    <circle cx="269" cy="208" r="4.5" fill="#FF8C00"/>
  </g>

  <!-- rocket -->
  <g transform="translate(322,168) rotate(38)">
    <!-- exhaust -->
    <path d="M-22 40 C -15 78 -8 100 0 118 C 8 100 15 78 22 40 Z" fill="#FFFFFF" opacity="0.85"/>
    <path d="M-15 42 C -10 74 -5 90 0 104 C 5 90 10 74 15 42 Z" fill="url(#eiFlame)"/>
    <path d="M-7 44 C -4 66 -2 78 0 88 C 2 78 4 66 7 44 Z" fill="#FFF0D6"/>
    <!-- fins -->
    <path d="M-28 8 C -52 24 -58 44 -56 60 L-28 44 Z" fill="#0B1220"/>
    <path d="M28 8 C 52 24 58 44 56 60 L28 44 Z" fill="#1E293B"/>
    <!-- body -->
    <path d="M0 -76 C 24 -44 32 -8 32 26 L32 44 L-32 44 L-32 26 C-32 -8 -24 -44 0 -76 Z" fill="url(#eiBody)"/>
    <!-- nose -->
    <path d="M0 -76 C 13 -56 21 -32 23 -12 L-23 -12 C-21 -32 -13 -56 0 -76 Z" fill="url(#eiNose)"/>
    <!-- window -->
    <circle cx="0" cy="8" r="15" fill="#0B1220"/>
    <circle cx="0" cy="8" r="10" fill="#8FBDEA"/>
    <path d="M-7 3 A 10 10 0 0 1 4 -1 L-4 12 A 10 10 0 0 1 -7 3 Z" fill="#FFFFFF" opacity="0.7"/>
    <!-- lower band -->
    <rect x="-32" y="32" width="64" height="12" rx="5" fill="#0B1220"/>
    <rect x="-32" y="32" width="64" height="4" rx="2" fill="#FF8C00" opacity="0.85"/>
  </g>

  <!-- sparkles -->
  <g fill="#FF8C00">
    <path d="M392 118 l6 16 16 6 -16 6 -6 16 -6-16 -16-6 16-6 z"/>
    <path d="M118 92 l4.5 12 12 4.5 -12 4.5 -4.5 12 -4.5-12 -12-4.5 12-4.5 z" opacity="0.8"/>
  </g>
  <g fill="#0B1220" opacity="0.7">
    <path d="M404 250 l4 11 11 4 -11 4 -4 11 -4-11 -11-4 11-4 z"/>
    <path d="M60 236 l3.5 9 9 3.5 -9 3.5 -3.5 9 -3.5-9 -9-3.5 9-3.5 z" opacity="0.6"/>
  </g>
</svg>
